# SPDX-License-Identifier: MIT
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    labels: [dependencies]
    groups:
      # Every codeql-action step must run the same version, so bump them in one PR.
      codeql-action:
        patterns: ["github/codeql-action*"]
