# SPDX-License-Identifier: MIT
name: Bump CMake dependencies and the speech models

on:
  schedule:
    - cron: "41 6 * * 2"
  workflow_dispatch:

permissions: {}

jobs:
  bump:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
    steps:
      - id: app
        if: ${{ vars.RELEASE_APP_ID != '' }}
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write
          permission-issues: write
      - if: ${{ steps.app.outputs.token == '' }}
        run: |
          echo "::warning::RELEASE_APP_ID is not set, falling back to GITHUB_TOKEN. CI on the PRs this job opens won't start on its own: close and reopen each PR (see docs/MAINTAINING.md, Release app)."
      - name: Pick the token
        env:
          TOKEN: ${{ steps.app.outputs.token || github.token }}
        run: echo "GH_TOKEN=$TOKEN" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Open PRs for newer pins
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # CMakeLists.txt pins commits; a release tag, if any, stays in a comment on the same line
          bump() {
            local var="$1" name="$2" new="$3" tag="${4:-}"
            [[ "$new" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::$name: '$new' is not a commit SHA"; return 1; }
            [[ -z "$tag" || "$tag" =~ ^v?[0-9][0-9A-Za-z.-]*$ ]] || { echo "::error::$name: bad tag '$tag'"; return 1; }
            local old
            old=$(sed -n "s/^set($var \([^ ]*\) .*/\1/p" CMakeLists.txt)
            [ "$old" != "$new" ] || { echo "$name is current ($old)"; return 0; }
            local version="${tag:-${new:0:12}}"
            local branch="deps/$name-$version"
            if git ls-remote --exit-code origin "refs/heads/$branch" >/dev/null; then
              echo "$branch already open"
              return 0
            fi
            git switch -c "$branch" origin/main
            sed -i -E "s/^set\($var $old (CACHE STRING \"[^\"]*\"\))( # .*)?$/set($var $new \1${tag:+ # $tag}/" CMakeLists.txt
            ! git diff --quiet CMakeLists.txt || { echo "::error::could not rewrite $var in CMakeLists.txt"; return 1; }
            git commit -s -am "build(deps): bump $name to $version"
            git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "$branch"
            gh pr create --base main --head "$branch" --label dependencies \
              --title "build(deps): bump $name to $version" \
              --body "Automated bump of \`$var\` from \`$old\` to \`$new\`${tag:+ ($tag)}. CI builds and tests it; check the upstream changelog before merging."
            git switch -
          }

          gh label create dependencies --color 0366D6 2>/dev/null || true
          bump TRANSCRIBE_CPP_TAG transcribe.cpp \
            "$(git ls-remote https://github.com/handy-computer/transcribe.cpp refs/heads/main | cut -f1)"
          imgui_tag=$(gh api repos/ocornut/imgui/releases/latest --jq .tag_name)
          bump IMGUI_TAG imgui "$(gh api "repos/ocornut/imgui/commits/$imgui_tag" --jq .sha)" "$imgui_tag"

          # Speech models: pin models.json to the HF repo's latest commit with fresh sizes and hashes
          python3 scripts/update-models.py
          if git diff --quiet models.json; then
            echo "speech models are current"
          else
            rev=$(python3 -c 'import json; print(json.load(open("models.json"))["revision"])')
            branch="deps/models-${rev:0:12}"
            if git ls-remote --exit-code origin "refs/heads/$branch" >/dev/null; then
              echo "$branch already open"
            else
              git stash
              git switch -c "$branch" origin/main
              git stash pop
              git commit -s -am "build(deps): pin the speech models to ${rev:0:12}"
              git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "$branch"
              gh pr create --base main --head "$branch" --label dependencies \
                --title "build(deps): pin the speech models to ${rev:0:12}" \
                --body "Automated update of \`models.json\` to commit \`$rev\` of the Hugging Face model repo, with the sizes and SHA-256 hashes its API reports. Every download is verified against them. Check the model card for changes before merging."
            fi
          fi
