# SPDX-License-Identifier: MIT
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    uses: ./.github/workflows/build.yml

  smoke:
    needs: build
    runs-on: ubuntu-24.04
    container: archlinux:base
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.build.outputs.artifact }}
          path: dist
      # Only the host libraries the AppImage deliberately leaves out
      - run: pacman -Syu --noconfirm python libpipewire vulkan-icd-loader wayland
      - name: Run the AppImage headless
        env:
          APPIMAGE_EXTRACT_AND_RUN: 1
        run: |
          cd dist
          python3 -m zipfile -e Whisker-x86_64.AppImage.zip .
          chmod +x Whisker-x86_64.AppImage
          ./Whisker-x86_64.AppImage --version
          ./Whisker-x86_64.AppImage --check-config

  hil:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.build.outputs.artifact }}
          path: dist
      - name: Install runtime libraries and the uhid, uinput and hid-steam modules
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libpipewire-0.3-0t64 libvulkan1 \
            libwayland-client0 libwayland-cursor0 libwayland-egl1
          # hid-steam lives in modules-extra on Ubuntu; without it the fake controller binds to hid-generic
          sudo apt-get install -y --no-install-recommends "linux-modules-extra-$(uname -r)" || true
          sudo modprobe -a uinput uhid
          sudo modprobe hid-steam || true
          ls -l /dev/uinput /dev/uhid
      - name: Virtual controllers against the AppImage
        run: |
          cd dist
          python3 -m zipfile -e Whisker-x86_64.AppImage.zip .
          chmod +x Whisker-x86_64.AppImage
          # AppRun execs whisker, so SIGTERM reaches the daemon; the extract-and-run runtime would absorb it
          ./Whisker-x86_64.AppImage --appimage-extract
          cd ..
          sudo python3 -I scripts/hil-test.py --whisker "$PWD/dist/squashfs-root/AppRun"

  install-script:
    needs: build
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        image: [archlinux:base, debian:trixie, ubuntu:24.04]
    container: ${{ matrix.image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.build.outputs.artifact }}
          path: dist
      - name: Install runtime packages
        run: |
          if command -v pacman >/dev/null; then
            pacman -Syu --noconfirm curl python libpipewire vulkan-icd-loader wayland
          else
            apt-get update
            apt-get install -y --no-install-recommends curl ca-certificates python3 libpipewire-0.3-0t64 libvulkan1 \
              libwayland-client0 libwayland-cursor0 libwayland-egl1
          fi
      - name: Install, reinstall, uninstall
        env:
          WHISKER_SKIP_SYSTEMD: 1
          APPIMAGE_EXTRACT_AND_RUN: 1
        # github.workspace is the host path; inside the container the checkout lives elsewhere
        run: WHISKER_RELEASE_URL="file://$PWD/dist" bash scripts/test-install.sh

  unit-python:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: make tools test-python

  decky-bundle:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: npm install --global pnpm@10.32.1
      - name: Rebuild decky/dist/index.js and compare with the committed bundle
        run: make decky-check

  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # shellcheck, ruff, actionlint, zizmor and REUSE at the versions in scripts/requirements-dev.txt
      - run: make tools lint

  dco:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check Signed-off-by on every commit
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: scripts/check-dco.sh "$BASE" "$HEAD"
