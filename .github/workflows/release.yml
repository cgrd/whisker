# SPDX-License-Identifier: MIT
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to (re)build and attach assets to, e.g. v1.2.0
        required: true

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-please:
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
    outputs:
      created: ${{ steps.rp.outputs.release_created }}
      tag: ${{ steps.rp.outputs.tag_name }}
    steps:
      - id: app
        if: ${{ vars.RELEASE_APP_ID != '' }}
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write
          permission-issues: write
      - if: ${{ steps.app.outputs.token == '' }}
        run: |
          echo "::warning::RELEASE_APP_ID is not set, falling back to GITHUB_TOKEN. CI on the PRs this job opens won't start on its own: close and reopen each PR (see docs/MAINTAINING.md, Release app)."
      - id: rp
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ steps.app.outputs.token || github.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  target:
    needs: release-please
    if: always() && (needs.release-please.outputs.created == 'true' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    permissions: {}
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - id: tag
        env:
          TAG: ${{ needs.release-please.outputs.tag || inputs.tag }}
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::bad tag '$TAG'"; exit 1; }
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

  build:
    needs: target
    if: always() && needs.target.result == 'success'
    permissions:
      contents: read
    uses: ./.github/workflows/build.yml

  publish:
    needs: [target, build]
    if: always() && needs.build.result == 'success'
    runs-on: ubuntu-24.04
    # Configure this environment to require maintainer approval (see docs/MAINTAINING.md)
    environment: release
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.build.outputs.artifact }}
          path: dist
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/Whisker-x86_64.AppImage.zip
            dist/Whisker-decky.zip
            dist/install.sh
            dist/Install-Whisker.desktop
            dist/Uninstall-Whisker.desktop
      - name: Attach assets and add install instructions
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.target.outputs.tag }}
        run: |
          python3 -m zipfile -e dist/Whisker-x86_64.AppImage.zip work
          chmod +x work/Whisker-x86_64.AppImage
          scripts/fetch-lgpl-sources.sh work
          mv work/Whisker-lgpl-sources.tar dist/
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --verify-tag --generate-notes
          gh release upload "$TAG" dist/* --clobber
          gh release view "$TAG" --json body --jq .body > changes.md
          if ! grep -q 'releases/latest/download/install.sh' changes.md; then
            cat .github/release-notes-header.md changes.md > notes.md
            gh release edit "$TAG" --notes-file notes.md
          fi
