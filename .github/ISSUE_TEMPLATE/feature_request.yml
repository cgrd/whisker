# SPDX-License-Identifier: MIT
name: Feature request
description: Suggest an improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what gets in the way?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Idea
      description: How you'd like it to work.
  - type: input
    id: platform
    attributes:
      label: Platform
      placeholder: Steam Deck Game Mode, KDE desktop, ...
