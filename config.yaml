# Speech model. Empty until you pick one in the settings window or the Decky panel,
# e.g. ~/.local/share/pedal-stt/models/parakeet-unified-en-0.6b-Q8_0.gguf
model: ""
backend: vulkan

# Save last N recordings as FLAC + text in ~/.local/share/pedal-stt/history/
# Set to 0 to disable
history: 50

# Show waveform + live transcription overlay (requires Wayland compositor with wlr-layer-shell)
overlay: true

# Controller button that records while held, on any controller: a button like L5 or a chord like L3+R3.
# Names: A B X Y L1 R1 L2 R2 L3 R3 L4 L5 R4 R5 select start guide assistant capture up down left right
# (assistant and capture are the Stadia controller's middle buttons)
trigger_button: L5

# Key pressed after dictated text is typed: none, enter, tab
submit_key: none

# Game chat profile: auto, none, or a profile name such as wow. "Party, pull in five"
# opens the chat box and types "/p Pull in five". auto uses the first profile whose
# match patterns hit a running process: a file name like Wow.exe, or a path part like
# _forever_/Wow.exe. Custom profiles and character names go under chat_profiles.
chat_profile: auto
# chat_profiles:
#   wow:
#     names:
#       thrall: Thrall
#   ffxiv:
#     open_key: enter
#     match: ffxiv_dx11.exe
#     channels:
#       party:
#         command: /p
#         say: party, party chat
#       free_company:
#         command: /fc
#         say: free company, fc
#       tell:
#         command: /tell
#         say: tell, whisper
#         target: true

# Install signed Whisker releases once a day (never while recording)
auto_update: true

pedals:
  left:
    action: key
    key: "ctrl+shift+alt+F1"
    mode: hold
  center:
    action: transcribe
    # Output mode: "type" (virtual keyboard), "clipboard" (wl-copy), "both"
    output: type
  right:
    action: key
    key: "ctrl+shift+alt+F3"
    mode: hold
