version = 1
SPDX-PackageName = "Whisker"
SPDX-PackageDownloadLocation = "https://github.com/cgrd/whisker"

[[annotations]]
path = "**"
precedence = "closest"
SPDX-FileCopyrightText = "2026 The Whisker authors"
SPDX-License-Identifier = "MIT"

# Icon art generated with Google Gemini; no copyright claimed.
[[annotations]]
path = "assets/**"
precedence = "override"
SPDX-FileCopyrightText = "NONE"
SPDX-License-Identifier = "CC0-1.0"

[[annotations]]
path = "fonts/**"
precedence = "override"
SPDX-FileCopyrightText = "2020 Braille Institute of America, Inc."
SPDX-License-Identifier = "OFL-1.1"

[[annotations]]
path = "protocol/wlr-layer-shell-unstable-v1.xml"
precedence = "override"
SPDX-FileCopyrightText = "2017 Drew DeVault"
SPDX-License-Identifier = "HPND-sell-variant"

# Rollup bundle: our plugin UI plus @decky/api (LGPL-2.1), react-icons (MIT)
# and the Font Awesome microphone icon (CC-BY-4.0)
[[annotations]]
path = "decky/dist/index.js"
precedence = "override"
SPDX-FileCopyrightText = [
    "2026 The Whisker authors",
    "SteamDeckHomebrew contributors",
    "2018 kamijin_fanta",
    "Fonticons, Inc.",
]
SPDX-License-Identifier = "MIT AND LGPL-2.1-only AND CC-BY-4.0"

[[annotations]]
path = "CODE_OF_CONDUCT.md"
precedence = "override"
SPDX-FileCopyrightText = "Contributor Covenant contributors"
SPDX-License-Identifier = "CC-BY-4.0"
